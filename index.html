<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>写作工具</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="identity"><div class="navigation-buttons"><button id="home-button" class="icon-button" aria-label="返回首页" title="返回首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/></svg></button></div><span class="app-name">写作工具</span><span class="save-state" id="save-state" role="status">正在打开…</span></div>
    <label class="size-control" for="font-size"><span class="small-a" aria-hidden="true">A</span><input id="font-size" type="range" min="16" max="36" value="22" aria-label="正文字号"><span class="large-a" aria-hidden="true">A</span><output id="size-value" for="font-size">22</output></label>
  </header>
  <main id="home-page" aria-label="作品管理"><div class="library-content"><div class="library-heading"><div><h1>我的作品</h1><p>每一个故事，都从这里开始。</p></div><img src="assets/logo.png" alt="" class="library-logo"></div><p id="library-message" role="status"></p><div id="book-list"></div><p id="library-empty" hidden>点击加号，开始一个新故事。</p></div></main>
  <div class="workspace">
    <div class="floating-navigation"><button id="drawer-toggle" class="icon-button" aria-label="展开章节目录" title="章节目录" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button></div>
    <aside id="drawer" inert aria-label="章节目录"><div class="drawer-title">章节</div><nav id="chapter-list" aria-label="章节导航"></nav><p id="chapter-empty">将段落设为章标题或节标题，<br>它们就会出现在这里。</p></aside>
    <main class="scroll-area" id="scroll-area">
      <div class="paper"><div id="editor" role="textbox" aria-label="小说正文" aria-multiline="true" contenteditable="false" spellcheck="false"></div><button id="paragraph-button" class="paragraph-button" aria-label="设置段落类型" aria-expanded="false" title="设置段落类型" hidden>⋮</button></div>
    </main>
  </div>
  <div id="paragraph-menu" role="menu" aria-label="段落类型" hidden><span class="menu-title">段落类型</span><button role="menuitemradio" data-type="chapter">章标题 <small>一级标题</small></button><button role="menuitemradio" data-type="section">节标题 <small>二级标题</small></button><button role="menuitemradio" data-type="body">正文</button></div>
  <dialog id="delete-dialog" aria-labelledby="delete-title"><h2 id="delete-title">删除作品？</h2><p id="delete-description"></p><p class="delete-note">正文和章节将一并删除，无法撤销。</p><div class="dialog-actions"><button id="delete-cancel">取消</button><button id="delete-confirm" class="danger-button">删除</button></div><p id="delete-error" role="alert" hidden></p></dialog>
  <script src="renderer.js"></script>
</body>
</html>
