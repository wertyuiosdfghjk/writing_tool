<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>写作工具</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="identity"><span class="app-name">写作工具</span><span class="save-state" id="save-state" role="status">正在打开…</span></div>
    <label class="size-control" for="font-size"><span class="small-a" aria-hidden="true">A</span><input id="font-size" type="range" min="16" max="36" value="22" aria-label="正文字号"><span class="large-a" aria-hidden="true">A</span><output id="size-value" for="font-size">22</output></label>
  </header>
  <main class="scroll-area" id="scroll-area">
    <div class="paper"><textarea id="editor" aria-label="小说正文" placeholder="从这里，写下故事的第一句话……" spellcheck="false" disabled></textarea></div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
